    // --- GLOBAL SOUND SYSTEM (SINGLETON API) ---
    // ==========================================
    let audioCtx = null;
    const getAudioContext = () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    };

    const playSoundEffect = (type) => {
      try {
        const ctx = getAudioContext();
        if (ctx.state === 'suspended') ctx.resume(); // Wajib untuk interaksi browser modern
        
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        
        if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(550, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(280, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
          osc.start();
          osc.stop(ctx.currentTime + 0.15);
        } else if (type === 'success') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
          osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2); // G5
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.45);
          osc.start();
          osc.stop(ctx.currentTime + 0.45);
        } else if (type === 'error') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(200, ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(130, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
          osc.start();
          osc.stop(ctx.currentTime + 0.25);
        } else if (type === 'fanfare') {
          const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const oscN = ctx.createOscillator();
            const gainN = ctx.createGain();
            oscN.connect(gainN);
            gainN.connect(ctx.destination);
            oscN.type = 'triangle';
            oscN.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
            gainN.gain.setValueAtTime(0.12, ctx.currentTime + idx * 0.1);
            gainN.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.1 + 0.3);
            oscN.start(ctx.currentTime + idx * 0.1);
            oscN.stop(ctx.currentTime + idx * 0.1 + 0.35);
          });
        }
      } catch (e) {
        console.log("Audio blocked", e);
      }
    };
